name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sopkathon_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysql --protocol=TCP -h 127.0.0.1 -uci -pci-password -D sopkathon_test -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 15s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sopkathon_test?sslMode=REQUIRED
      SPRING_DATASOURCE_USERNAME: ci
      SPRING_DATASOURCE_PASSWORD: ci-password
      AWS_S3_BUCKET: sopkathon-android1-files-20261121
      AWS_REGION: ap-southeast-2

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: sh ./gradlew --no-daemon build

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build and publish Docker image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$GITHUB_SHA" -t "$image:main" .

          docker push "$image:$GITHUB_SHA"

          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            docker push "$image:main"
          fi
