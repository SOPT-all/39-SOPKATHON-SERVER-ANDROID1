spring:
  application:
    name: 39-SOPKATHON-SERVER-ANDROID1
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
server:
  forward-headers-strategy: native
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  timeout: ${GEMINI_TIMEOUT:8s}
